<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1510" viewBox="0 0 1400 1510" role="img" aria-labelledby="title desc">
  <title id="title">Wireframe halaman pasien SehatQ</title>
  <desc id="desc">Rancangan halaman pasien sebelum login dan dashboard setelah login.</desc>
  <defs>
    <style>
      text{font-family:Arial,sans-serif;fill:#253d48}.title{font-size:26px;font-weight:700}.section{font-size:19px;font-weight:700;fill:#0d6b82}.label{font-size:14px;font-weight:700}.small{font-size:12px;fill:#607780}.muted{font-size:13px;fill:#82949a}.box{fill:#fff;stroke:#9bb0b7;stroke-width:2}.dash{fill:#f4f8f9;stroke:#afc0c5;stroke-width:2;stroke-dasharray:8 6}.pill{fill:#eaf5f7;stroke:#9bbfc7;stroke-width:1.5}.line{stroke:#dbe5e8;stroke-width:2}
    </style>
  </defs>
  <rect width="1400" height="1510" fill="#f3f7f8"/>
  <text x="48" y="46" class="title">SEHATQ — WIREFRAME PASIEN</text>
  <text x="48" y="75" class="small">Sketsa struktur layar; isi nomor dan status berasal dari Firebase, bukan data contoh.</text>

  <text x="48" y="119" class="section">1. Beranda, masuk, dan registrasi</text>
  <rect x="40" y="140" width="1320" height="710" rx="14" class="box"/>
  <rect x="60" y="160" width="1280" height="60" rx="8" class="dash"/>
  <rect x="82" y="174" width="34" height="32" rx="8" class="pill"/>
  <text x="93" y="196" class="label">+</text>
  <text x="128" y="184" class="label">SehatQ</text>
  <text x="128" y="202" class="muted">ANTREAN PUSKESMAS</text>
  <text x="960" y="196" class="small">Cara kerja</text>
  <rect x="1150" y="173" width="164" height="34" rx="7" class="pill"/>
  <text x="1180" y="195" class="small">Masuk petugas</text>

  <rect x="60" y="242" width="1280" height="214" rx="10" fill="#f6fafb" stroke="#d7e3e6"/>
  <text x="95" y="282" class="small">LAYANAN ANTREAN DIGITAL</text>
  <text x="95" y="329" class="title">Urus antrean,</text>
  <text x="95" y="365" class="title" fill="#0d6b82">tanpa menunggu.</text>
  <text x="95" y="397" class="small">Daftar dari rumah dan pantau giliran secara real-time.</text>
  <rect x="95" y="414" width="155" height="30" rx="7" fill="#0d6b82"/>
  <text x="118" y="434" font-size="12" font-weight="700" fill="#fff">Mulai daftar</text>
  <rect x="820" y="272" width="430" height="146" rx="12" class="dash"/>
  <text x="865" y="315" class="small">AREA ILUSTRASI / INFORMASI PUSKESMAS</text>
  <text x="865" y="352" class="label">Layanan tersedia</text>
  <text x="865" y="380" class="muted">Tidak menampilkan tiket statis atau data pasien.</text>

  <rect x="60" y="477" width="400" height="70" rx="9" class="dash"/>
  <rect x="500" y="477" width="400" height="70" rx="9" class="dash"/>
  <rect x="940" y="477" width="400" height="70" rx="9" class="dash"/>
  <text x="82" y="505" class="label">01 · Daftar mudah</text>
  <text x="82" y="527" class="muted">Pilih poli, ambil nomor dari ponsel.</text>
  <text x="522" y="505" class="label">02 · Pantau langsung</text>
  <text x="522" y="527" class="muted">Status berubah tanpa refresh.</text>
  <text x="962" y="505" class="label">03 · Datang tepat waktu</text>
  <text x="962" y="527" class="muted">Cek antrean sebelum berangkat.</text>

  <rect x="60" y="570" width="620" height="250" rx="10" class="box"/>
  <rect x="720" y="570" width="620" height="250" rx="10" class="box"/>
  <text x="88" y="608" class="label">Masuk pasien</text>
  <text x="88" y="630" class="muted">Akses antrean dan riwayat pendaftaran.</text>
  <text x="88" y="669" class="small">Email</text>
  <rect x="88" y="678" width="560" height="34" rx="5" class="dash"/>
  <text x="88" y="742" class="small">Kata sandi</text>
  <rect x="88" y="751" width="560" height="34" rx="5" class="dash"/>
  <rect x="88" y="791" width="560" height="22" rx="5" fill="#0d6b82"/>
  <text x="322" y="807" font-size="11" font-weight="700" fill="#fff">Masuk</text>

  <text x="748" y="608" class="label">Buat akun pasien</text>
  <text x="748" y="630" class="muted">Firebase Authentication mengelola kata sandi.</text>
  <text x="748" y="665" class="small">Nama lengkap</text>
  <rect x="748" y="672" width="560" height="27" rx="5" class="dash"/>
  <text x="748" y="720" class="small">Nomor telepon</text>
  <rect x="748" y="727" width="560" height="27" rx="5" class="dash"/>
  <text x="748" y="775" class="small">Email + kata sandi</text>
  <rect x="748" y="782" width="560" height="27" rx="5" class="dash"/>
  <rect x="1130" y="791" width="178" height="22" rx="5" fill="#e7f5ed"/>
  <text x="1168" y="807" font-size="11" font-weight="700" fill="#26764f">Daftar pasien</text>

  <text x="48" y="902" class="section">2. Dashboard pasien setelah login</text>
  <rect x="40" y="923" width="1320" height="548" rx="14" class="box"/>
  <rect x="60" y="944" width="1280" height="52" rx="8" class="dash"/>
  <text x="84" y="976" class="label">+ SehatQ</text>
  <rect x="1220" y="953" width="92" height="32" rx="7" class="pill"/>
  <text x="1241" y="974" class="small">Keluar</text>
  <text x="82" y="1033" class="title">Halo, [nama pasien]</text>
  <text x="82" y="1057" class="muted">Pantau antrean aktif dan riwayat kunjungan.</text>

  <rect x="60" y="1075" width="510" height="205" rx="10" class="box"/>
  <text x="84" y="1108" class="label">AMBIL ANTREAN</text>
  <text x="84" y="1136" class="small">Poli tujuan</text>
  <rect x="84" y="1145" width="462" height="37" rx="5" class="dash"/>
  <text x="102" y="1169" class="muted">Pilih poli aktif</text>
  <rect x="84" y="1200" width="462" height="38" rx="6" fill="#0d6b82"/>
  <text x="225" y="1224" font-size="12" font-weight="700" fill="#fff">Ambil nomor antrean</text>
  <text x="84" y="1260" class="muted">Nomor otomatis per tanggal dan poli.</text>

  <rect x="590" y="1075" width="750" height="205" rx="10" class="box"/>
  <text x="614" y="1108" class="label">ANTREAN SAYA · REAL-TIME</text>
  <rect x="614" y="1125" width="702" height="128" rx="8" class="dash"/>
  <text x="638" y="1162" class="small">Nomor: [nomor dari sistem]</text>
  <text x="638" y="1190" class="small">Poli: [poli] · Status: [menunggu / dipanggil]</text>
  <text x="638" y="1218" class="small">Posisi antrean: [dihitung dari ringkasan antrean]</text>
  <text x="1112" y="1242" class="muted">[Batalkan jika masih menunggu]</text>

  <rect x="60" y="1300" width="1280" height="145" rx="10" class="box"/>
  <text x="84" y="1332" class="label">RIWAYAT ANTREAN</text>
  <line x1="84" y1="1348" x2="1315" y2="1348" class="line"/>
  <text x="92" y="1374" class="small">Nomor</text>
  <text x="340" y="1374" class="small">Poli</text>
  <text x="625" y="1374" class="small">Tanggal</text>
  <text x="910" y="1374" class="small">Status</text>
  <text x="92" y="1414" class="muted">Riwayat dimuat dari akun pasien yang sedang login.</text>
</svg>
