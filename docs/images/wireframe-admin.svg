  <text x="1032" y="314" class="small">Tanggal layanan</text>
  <rect x="1190" y="291" width="172" height="37" rx="6" class="dash"/>
  <text x="1204" y="314" class="small">Semua poli  v</text>
  <rect x="304" y="358" width="1060" height="42" rx="5" fill="#f2f7f8" stroke="#dce7e9"/>
  <text x="319" y="384" class="small">NO. ANTREAN</text>
  <text x="465" y="384" class="small">PASIEN</text>
  <text x="675" y="384" class="small">POLI</text>
  <text x="830" y="384" class="small">WAKTU DAFTAR</text>
  <text x="985" y="384" class="small">STATUS</text>
  <text x="1120" y="384" class="small">TINDAKAN</text>
  <g class="small">
    <line x1="304" y1="445" x2="1364" y2="445" class="line"/>
    <line x1="304" y1="490" x2="1364" y2="490" class="line"/>
    <line x1="304" y1="535" x2="1364" y2="535" class="line"/>
    <line x1="304" y1="580" x2="1364" y2="580" class="line"/>
    <line x1="304" y1="625" x2="1364" y2="625" class="line"/>
  </g>
  <g class="small">
    <text x="319" y="430">[nomor]</text><text x="465" y="430">[nama pasien]</text><text x="675" y="430">[poli]</text><text x="830" y="430">[jam]</text>
    <text x="319" y="475">[nomor]</text><text x="465" y="475">[nama pasien]</text><text x="675" y="475">[poli]</text><text x="830" y="475">[jam]</text>
    <text x="319" y="520">[nomor]</text><text x="465" y="520">[nama pasien]</text><text x="675" y="520">[poli]</text><text x="830" y="520">[jam]</text>
    <text x="319" y="565">[nomor]</text><text x="465" y="565">[nama pasien]</text><text x="675" y="565">[poli]</text><text x="830" y="565">[jam]</text>
    <text x="319" y="610">[nomor]</text><text x="465" y="610">[nama pasien]</text><text x="675" y="610">[poli]</text><text x="830" y="610">[jam]</text>
  </g>
  <g font-family="Arial,sans-serif" font-size="10" font-weight="700">
    <rect x="977" y="412" width="74" height="24" rx="12" fill="#fff4d8"/><text x="991" y="428" fill="#87651d">Menunggu</text>
    <rect x="977" y="457" width="74" height="24" rx="12" fill="#e4f4fb"/><text x="992" y="473" fill="#286984">Dipanggil</text>
    <rect x="977" y="502" width="74" height="24" rx="12" fill="#e6f6ed"/><text x="998" y="518" fill="#27784d">Selesai</text>
  </g>
  <rect x="1110" y="411" width="104" height="26" rx="5" fill="#eaf5f7" stroke="#c4dce1"/>
  <text x="1131" y="428" class="muted">Panggil</text>
  <rect x="1224" y="411" width="88" height="26" rx="5" class="dash"/>
  <text x="1245" y="428" class="muted">Lewati</text>

  <rect x="282" y="733" width="1104" height="218" rx="10" class="box"/>
  <text x="306" y="770" class="small">KONFIGURASI</text>
  <text x="306" y="800" class="heading">Kelola data poli</text>
  <rect x="306" y="818" width="385" height="38" rx="6" class="dash"/>
  <text x="322" y="842" class="muted">Nama poli baru</text>
  <rect x="702" y="818" width="120" height="38" rx="6" fill="#0d6b82"/>
  <text x="722" y="842" font-size="11" font-weight="700" fill="#fff">Tambah poli</text>
  <rect x="306" y="875" width="250" height="42" rx="7" class="dash"/>
  <text x="325" y="901" class="small">[Poli] · Aktif  [Nonaktifkan]</text>
  <rect x="570" y="875" width="250" height="42" rx="7" class="dash"/>
  <text x="589" y="901" class="small">[Poli] · Nonaktif  [Aktifkan]</text>
  <text x="282" y="969" class="muted">Tabel memuat antrean dari tanggal yang dipilih; data pasien hanya untuk admin berwenang.</text>
</svg>
