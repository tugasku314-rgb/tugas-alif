<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1000" viewBox="0 0 1440 1000" role="img" aria-labelledby="title desc">
  <title id="title">Wireframe dashboard petugas SehatQ</title>
  <desc id="desc">Rancangan dashboard admin dengan sidebar, statistik, antrean, filter, dan pengelolaan poli.</desc>
  <defs>
    <style>
      text{font-family:Arial,sans-serif;fill:#253d48}.title{font-size:27px;font-weight:700}.heading{font-size:19px;font-weight:700}.label{font-size:13px;font-weight:700}.small{font-size:11px;fill:#607780}.muted{font-size:10px;fill:#82949a}.box{fill:#fff;stroke:#9bb0b7;stroke-width:2}.dash{fill:#f4f8f9;stroke:#afc0c5;stroke-width:1.5;stroke-dasharray:7 5}.line{stroke:#dbe5e8;stroke-width:1.5}
    </style>
  </defs>
  <rect width="1440" height="1000" fill="#f3f7f8"/>
  <rect x="24" y="24" width="1392" height="952" rx="14" class="box"/>
  <rect x="24" y="24" width="225" height="952" rx="14" fill="#f8fbfb" stroke="#9bb0b7" stroke-width="2"/>
  <text x="50" y="73" class="heading" fill="#0d6b82">+ SehatQ</text>
  <text x="50" y="95" class="muted">PORTAL PETUGAS</text>
  <line x1="48" y1="119" x2="225" y2="119" class="line"/>
  <text x="50" y="158" class="muted">MENU UTAMA</text>
  <rect x="42" y="175" width="190" height="43" rx="7" fill="#eaf4f6" stroke="#c3d9de"/>
  <text x="60" y="202" class="label" fill="#0d6b82">▦  Ringkasan</text>
  <text x="60" y="250" class="label">◎  Antrean pasien</text>
  <text x="60" y="298" class="label">⚙  Kelola poli</text>
  <line x1="48" y1="880" x2="225" y2="880" class="line"/>
  <circle cx="69" cy="917" r="18" fill="#e5f4ec" stroke="#a8d1b8"/>
  <text x="59" y="922" class="small">PT</text>
  <text x="96" y="914" class="label">Petugas</text>
  <text x="96" y="932" class="muted">Administrator</text>
  <text x="205" y="922" class="small">↪</text>

  <text x="282" y="61" class="small">PUSKESMAS · PANEL PETUGAS</text>
  <text x="282" y="96" class="title">Dashboard antrean</text>
  <rect x="1192" y="47" width="194" height="34" rx="17" fill="#e7f6ed" stroke="#b7ddc6"/>
  <circle cx="1212" cy="64" r="5" fill="#38a675"/>
  <text x="1225" y="68" class="small">Tersambung real-time</text>

  <rect x="282" y="121" width="265" height="125" rx="10" class="box"/>
  <rect x="303" y="141" width="32" height="32" rx="9" fill="#e6f2f6"/>
  <text x="312" y="163" class="label" fill="#0d6b82">◎</text>
  <text x="350" y="161" class="small">Menunggu</text>
  <text x="303" y="205" class="title">[#]</text>
  <text x="303" y="229" class="muted">Antrean pada tanggal pilihan</text>
  <rect x="562" y="121" width="265" height="125" rx="10" class="box"/>
  <rect x="583" y="141" width="32" height="32" rx="9" fill="#fff2e4"/>
  <text x="592" y="163" class="label">◉</text>
  <text x="630" y="161" class="small">Sedang dipanggil</text>
  <text x="583" y="205" class="title">[#]</text>
  <text x="583" y="229" class="muted">Dalam pelayanan</text>
  <rect x="842" y="121" width="265" height="125" rx="10" class="box"/>
  <rect x="863" y="141" width="32" height="32" rx="9" fill="#e7f6ed"/>
  <text x="872" y="163" class="label">✓</text>
  <text x="910" y="161" class="small">Selesai</text>
  <text x="863" y="205" class="title">[#]</text>
  <text x="863" y="229" class="muted">Jumlah pada periode pilihan</text>
  <rect x="1122" y="121" width="264" height="125" rx="10" class="box"/>
  <rect x="1143" y="141" width="32" height="32" rx="9" fill="#f8ecea"/>
  <text x="1152" y="163" class="label">↶</text>
  <text x="1190" y="161" class="small">Dilewati / batal</text>
  <text x="1143" y="205" class="title">[#]</text>
  <text x="1143" y="229" class="muted">Jumlah pada periode pilihan</text>

  <rect x="282" y="270" width="1104" height="440" rx="10" class="box"/>
